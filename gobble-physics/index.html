<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gobble Town Physics</title>
<style>
  :root{--ink:#253747;--card:#fffdf7;--accent:#ff6379}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f5;overscroll-behavior:none;
    font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;color:var(--ink);
    user-select:none;-webkit-user-select:none}
  canvas#c{display:block;touch-action:none;position:fixed;inset:0}
  .hud{position:fixed;pointer-events:none;z-index:5}
  #topl{top:10px;left:10px;display:flex;flex-direction:column;gap:6px}
  .pill,#board{background:rgba(255,253,241,.96);border:2px solid rgba(255,255,255,.95);
    box-shadow:0 3px 0 rgba(45,68,72,.15),0 6px 12px rgba(28,54,53,.15);color:#314657}
  .pill{border-radius:999px;padding:7px 13px;font-weight:800;font-size:15px}
  #lvl:before{content:'⭐ ';font-size:13px}
  #score:before{content:'🍭 ';font-size:13px}
  #timer{top:10px;left:50%;transform:translateX(-50%);font-size:22px;padding:6px 16px;font-variant-numeric:tabular-nums;min-width:83px;text-align:center}
  #timer.low{background:#ff6077;color:#fff;border-color:#ff9e9c;animation:timer-alert 1s ease-in-out infinite}
  @keyframes timer-alert{50%{transform:translateX(-50%) scale(1.055)}}
  #board{top:10px;right:10px;border-radius:17px;padding:9px 11px;font-size:12.5px;font-weight:700;min-width:136px}
  #board div{display:flex;justify-content:space-between;gap:9px;padding:3px 5px;border-radius:7px}
  #board div.me{background:#ffe2b7;color:#bb3d60}
  #board .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid rgba(0,0,0,.12)}
  #mute{position:fixed;bottom:12px;right:12px;z-index:6;border:2px solid #fff;border-radius:50%;width:44px;height:44px;font-size:20px;background:#fffaf0;
    box-shadow:0 4px 0 rgba(43,58,66,.15),0 5px 10px rgba(43,58,66,.16);cursor:pointer}
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) scale(.8);opacity:0;transition:all .25s;border-radius:16px;
    padding:10px 18px;font-weight:900;font-size:20px;z-index:7;pointer-events:none;white-space:nowrap;
    border:3px solid #fff4d9;background:linear-gradient(#fffdf8,#ffedb7);box-shadow:0 5px 0 rgba(107,90,60,.16),0 9px 20px rgba(43,57,60,.19);color:#35546a}
  #toast.show{opacity:1;transform:translateX(-50%) scale(1)}
  #msg{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);z-index:7;font-weight:900;font-size:28px;color:#fff;
    text-shadow:0 3px 0 #000,0 0 12px #000;text-align:center;pointer-events:none;display:none;white-space:pre-line;width:90vw}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .hl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;display:flex;flex-direction:column;align-items:center;gap:3px}
  .hn{display:flex;align-items:center;gap:5px;font-weight:900;font-size:13px;color:#fffdf5;background:rgba(29,43,56,.84);padding:2px 9px 2px 3px;border-radius:12px}
  .lv{min-width:24px;height:20px;padding:0 6px;border-radius:10px;background:#5b6b78;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
  .lv:before{content:'Lv';font-size:8px;margin-right:1px;opacity:.85}
  .hl.prey .lv{background:#2fbf71}.hl.danger .lv{background:#ff4d5e}.hl.me .lv{background:#ffb627;color:#3a2a00}
  .bars{display:flex;align-items:center;gap:4px}
  .bar{width:62px;height:8px;border-radius:5px;background:rgba(29,43,56,.62);overflow:hidden;border:1.5px solid rgba(255,255,255,.9)}
  .bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .2s}
  .hl.me .bar{width:86px;height:10px}
  .nx{font-size:14px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  .pop.big{font-size:26px;letter-spacing:.5px;text-shadow:0 3px 0 #7a4a00,0 0 8px rgba(0,0,0,.45)}
  .pop{position:absolute;left:0;top:0;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(26,44,54,.7),0 0 4px rgba(26,44,54,.6);will-change:transform,opacity}
  #joy{position:fixed;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:rgba(255,255,255,.21);border:2px solid rgba(255,255,255,.55);
    pointer-events:none;z-index:6;display:none}
  #knob{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.88);border:9px solid rgba(255,255,255,.88);
    pointer-events:none;z-index:6;display:none}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:14px;
    background:rgba(21,42,55,.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .card{border:3px solid rgba(255,255,255,.95);background:linear-gradient(160deg,#fffdf5 0%,#fff5e4 100%);border-radius:29px;
    box-shadow:0 16px 0 rgba(42,64,69,.13),0 24px 62px rgba(21,40,50,.33);padding:20px 20px 23px;max-width:420px;width:100%;text-align:center;max-height:100%;overflow:auto}
  h1{margin:0 0 4px;font-size:37px;line-height:1.05;font-weight:900;color:#2c4555;letter-spacing:-1.6px;text-shadow:0 2px 0 #fff}
  h1 span{display:inline-block;width:29px;height:22px;border-radius:50%;vertical-align:2px;background:radial-gradient(ellipse,#101423 54%,#ff6880 58%,#ff6880 72%,transparent 74%)}
  h1 b{font-size:.55em;background:#2c4555;color:#fff;border-radius:8px;padding:2px 7px;vertical-align:6px;letter-spacing:0}
  .sub{margin:7px 0 14px;font-size:15px;color:#6d7b81;font-weight:650}
  label.lbl{display:block;text-align:left;font-weight:800;color:#627683;letter-spacing:.9px;font-size:11px;margin:12px 0 6px;text-transform:uppercase}
  input[type=text]{width:100%;font:inherit;font-size:20px;font-weight:800;padding:10px 14px;border-radius:14px;border:3px solid #e2e8df;outline:none;text-align:center;color:#263e4b;background:#fff}
  input[type=text]:focus{border-color:var(--accent)}
  .swatches{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3e8e1,0 3px 4px rgba(29,43,50,.16);cursor:pointer;transition:transform .17s}
  .sw.on{box-shadow:0 0 0 3px #304a59,0 3px 6px rgba(29,43,50,.23);transform:scale(1.09)}
  .opts{display:flex;gap:8px}
  .maps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.maps .opt{font-size:13px;padding:9px 4px}
  .opt{flex:1;border:3px solid #e3eae6;background:#fff;border-radius:14px;padding:10px 6px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;line-height:1.2;color:#354d57;box-shadow:0 3px 0 rgba(48,72,77,.09)}
  .opt small{display:block;font-weight:600;font-size:11px;color:#6a7b82;margin-top:3px}
  .opt.on{background:#fff1da;border-color:#f1aa6c}
  .go{margin-top:18px;width:100%;border:2px solid rgba(255,255,255,.5);border-radius:18px;padding:16px;font:inherit;font-size:24px;font-weight:900;color:#fff;letter-spacing:.5px;
    background:linear-gradient(#ff8a7b,#f75b74);box-shadow:0 6px 0 #ca405e,0 9px 16px rgba(210,89,103,.16);cursor:pointer}
  .go:active{transform:translateY(4px);box-shadow:0 2px 0 #ca405e}
  .go:disabled{opacity:.6}
  .how{font-size:13px;color:#728087;margin-top:12px;line-height:1.4}
  #results div{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;font-weight:800;font-size:17px;margin:4px 0;background:#f1eee4;color:#304853}
  #results div.me{background:#ffe4a5}
  .big{font-size:30px;font-weight:900;margin:4px 0 2px}
  .hidden{display:none!important}
  @media (max-height:720px){.card{padding:12px 16px 15px}h1{font-size:31px}.sub{margin:4px 0 7px}.go{margin-top:12px;padding:12px}.how{margin-top:7px}}
  @media (max-width:520px){#toast{top:148px;font-size:18px}}
  @media (max-width:420px){h1{font-size:32px}#board{min-width:105px;font-size:10px;padding:6px}#board div{gap:5px;padding:2px}
    .pill{font-size:13px}#timer{font-size:17px}.opt{font-size:13px;padding:8px 4px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="topl" class="hud hidden"><div class="pill" id="lvl">Level 1</div><div class="pill" id="score">0 pts</div></div>
<div id="timer" class="hud pill hidden">2:00</div>
<div id="board" class="hud hidden"></div>
<button id="mute" class="hidden" aria-label="Sound">🔊</button>
<div id="toast"></div>
<div id="msg"></div>
<div id="joy"></div><div id="knob"></div>

<div id="menu" class="overlay">
  <div class="card">
    <h1><span></span> Gobble Town <b>PHYSICS</b></h1>
    <p class="sub">Swallow the town. Get bigger. Be the biggest hole!</p>
    <label class="lbl">Your name</label>
    <input type="text" id="name" maxlength="12" value="Me">
    <label class="lbl">Your hole color</label>
    <div class="swatches" id="swatches"></div>
    <label class="lbl">Map</label>
    <div class="maps" id="maps">
      <button class="opt on" data-v="town">🏙️ Gobble Town</button>
      <button class="opt" data-v="chicago">🌭 Chicago</button>
      <button class="opt" data-v="newyork">🗽 New York</button>
      <button class="opt" data-v="dc">🏛️ Washington DC</button>
      <button class="opt" data-v="london">💂 London</button>
      <button class="opt" data-v="tokyo">🗼 Tokyo</button>
    </div>
    <label class="lbl">Mode</label>
    <div class="opts" id="modes">
      <button class="opt on" data-v="easy">🐣 Little kids<small>Nobody can gobble you</small></button>
      <button class="opt" data-v="normal">😎 Normal<small>Watch out for big holes!</small></button>
    </div>
    <label class="lbl">Round length</label>
    <div class="opts" id="lens">
      <button class="opt" data-v="60">1 min</button>
      <button class="opt on" data-v="120">2 min</button>
      <button class="opt" data-v="180">3 min</button>
      <button class="opt" data-v="300">5 min</button>
    </div>
    <button class="go" id="play" disabled>Loading…</button>
    <div class="how">📱 Drag your finger anywhere to steer<br>🖱️ Point with the mouse · ⌨️ or use arrow keys / WASD</div>
    <div class="how" id="best"></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <div id="place" class="big"></div>
    <p class="sub" id="overSub"></p>
    <div id="results"></div>
    <button class="go" id="again">PLAY AGAIN</button>
    <button class="opt" id="toMenu" style="margin-top:10px;width:100%">Change settings</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;
  const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);gg=Math.round((t-gg)*p+gg);b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1);}
function hash(a,b,s=0){const n=Math.sin(a*127.1+b*311.7+s*74.7)*43758.5453123;return n-Math.floor(n);}

/* ================= world rules (same as 2D) ================= */
const BLOCK=320,ROAD=80,N=7,W=N*BLOCK+(N+1)*ROAD,R0=16,RMAX=170,G=0.11;
const T={
  cone:{w:10,d:10,h:14,pts:1}, hydrant:{w:10,d:10,h:14,pts:1}, trash:{w:14,d:14,h:16,pts:2},
  ball:{w:12,d:12,h:12,pts:1}, duck:{w:12,d:12,h:12,pts:2}, mailbox:{w:12,d:12,h:18,pts:2},
  lamp:{w:8,d:8,h:48,pts:2}, bench:{w:28,d:10,h:12,pts:3}, bush:{w:22,d:22,h:16,pts:3},
  car:{w:38,d:20,h:20,pts:8}, tree:{w:34,d:34,h:40,pts:6}, bus:{w:64,d:24,h:22,pts:20},
  house:{w:70,d:60,h:42,pts:30}, shop:{w:96,d:80,h:50,pts:50}, fountain:{w:70,d:70,h:26,pts:40},
  tower:{w:130,d:130,h:150,pts:120},
  pigeon:{w:8,d:8,h:8,pts:1}, flower:{w:10,d:10,h:14,pts:1}, sign:{w:9,d:9,h:34,pts:2}, bike:{w:22,d:8,h:12,pts:3},
  cat:{w:14,d:8,h:13,pts:3}, dog:{w:18,d:9,h:14,pts:4}, picnic:{w:26,d:20,h:10,pts:4}, cart:{w:26,d:14,h:34,pts:5},
  phone:{w:14,d:14,h:33,pts:4}, dumpster:{w:28,d:16,h:16,pts:6}, slide:{w:36,d:14,h:22,pts:8}, swings:{w:40,d:18,h:27,pts:10},
  icecream:{w:44,d:22,h:38,pts:14}, garbage:{w:52,d:24,h:24,pts:18}, fire:{w:60,d:24,h:28,pts:22},
  carousel:{w:80,d:80,h:58,pts:70}, ferris:{w:130,d:90,h:135,pts:160},
  rowhouse:{w:26,d:44,h:44,pts:12},
  person:{w:6,d:6,h:16,pts:1}, median:{w:60,d:10,h:8,pts:4},
  rocket:{w:60,d:60,h:150,pts:70}, duckstatue:{w:90,d:80,h:90,pts:80}, bean:{w:130,d:80,h:54,pts:90}, dino:{w:150,d:50,h:112,pts:110},
  supertall:{w:130,d:130,h:580,pts:600,rr:215},
  // city landmarks and themed things
  willis:{w:120,d:120,h:560,pts:650,rr:230}, hancock:{w:100,d:100,h:480,pts:500,rr:205}, buckingham:{w:150,d:150,h:52,pts:120},
  empire:{w:110,d:110,h:550,pts:600,rr:225}, chrysler:{w:96,d:96,h:470,pts:450,rr:190}, liberty:{w:96,d:96,h:235,pts:500,rr:210}, billboard:{w:42,d:8,h:52,pts:15},
  capitol:{w:260,d:150,h:185,pts:700,rr:235}, wamonument:{w:44,d:44,h:375,pts:450,rr:200}, lincoln:{w:150,d:100,h:72,pts:150}, whitehouse:{w:150,d:96,h:64,pts:130},
  bigben:{w:64,d:64,h:362,pts:450,rr:200}, towerbridge:{w:280,d:60,h:165,pts:700,rr:240}, eye:{w:200,d:60,h:215,pts:600,rr:215}, stpauls:{w:150,d:110,h:156,pts:180},
  tokyotower:{w:130,d:130,h:340,pts:600,rr:225}, skytree:{w:100,d:100,h:602,pts:800,rr:245}, pagoda:{w:74,d:74,h:152,pts:90}, torii:{w:84,d:14,h:66,pts:40},
  sakura:{w:34,d:34,h:40,pts:6}, vending:{w:12,d:10,h:24,pts:3}, postbox:{w:10,d:10,h:20,pts:2},
  taxi:{w:38,d:20,h:22,pts:8}, cab:{w:38,d:20,h:24,pts:8}, dbus:{w:64,d:24,h:40,pts:25}, robot:{w:120,d:90,h:330,pts:700,rr:225}, stadium:{w:286,d:286,h:82,pts:800,rr:235},
  diner:{w:84,d:60,h:42,pts:35}, gas:{w:110,d:90,h:40,pts:55}, apartment:{w:100,d:80,h:100,pts:65},
  firestation:{w:104,d:84,h:72,pts:70}, school:{w:130,d:100,h:70,pts:90}, office:{w:116,d:116,h:230,pts:150},
};
for(const k in T){T[k].r=T[k].rr||Math.hypot(T[k].w,T[k].d)/2*0.75;T[k].k=k;}   // rr: giants that need level 30+
const UNLOCKS=[['car','🚗','You can gobble CARS!'],['tree','🌳','Now TREES!'],['icecream','🍦','ICE CREAM TRUCKS!'],['garbage','🚛','GARBAGE TRUCKS!'],
  ['fire','🚒','FIRE TRUCKS!'],['bus','🚌','BUSES are yummy now!'],['rowhouse','🏘️','ROW HOUSES!'],['house','🏠','You can eat HOUSES!'],['carousel','🎠','The CAROUSEL!'],
  ['shop','🏪','STORES too!'],['diner','🍔','DINERS!'],['apartment','🏢','APARTMENTS!'],['gas','⛽','GAS STATIONS!'],
  ['firestation','🚒','FIRE STATIONS!'],['school','🏫','SCHOOLS!'],['office','🌆','GLASS TOWERS!'],['rocket','🚀','ROCKET STATUES!'],['duckstatue','🦆','The GIANT DUCK!'],
  ['bean','🫘','The BIG SILVER BEAN!'],['dino','🦖','The DINOSAUR!'],['supertall','🗼','MEGA TOWERS!'],
  ['taxi','🚕','TAXIS!'],['cab','🚕','BLACK CABS!'],['dbus','🚌','DOUBLE-DECKERS!'],['billboard','📺','BILLBOARDS!'],['torii','⛩️','The TORII GATE!'],
  ['pagoda','🏯','The PAGODA!'],['buckingham','⛲','BUCKINGHAM FOUNTAIN!'],['whitehouse','🏠','The WHITE HOUSE!'],['lincoln','🏛️','The LINCOLN MEMORIAL!'],
  ['stpauls','🏰',"ST PAUL'S!"],['chrysler','✨','The CHRYSLER BUILDING!'],['wamonument','🔺','The WASHINGTON MONUMENT!'],['bigben','🕰️','BIG BEN!'],
  ['hancock','🏢','The HANCOCK!'],['liberty','🗽','The STATUE OF LIBERTY!'],['eye','🎡','The LONDON EYE!'],['empire','🏙️','The EMPIRE STATE!'],
  ['tokyotower','🗼','TOKYO TOWER!'],['willis','🏙️','WILLIS TOWER!'],['capitol','🏛️','The CAPITOL!'],['towerbridge','🌉','TOWER BRIDGE!'],['skytree','📡','The SKYTREE!'],['robot','🤖','The GIANT ROBOT!'],['stadium','🏟️','The STADIUM!'],['fountain','⛲','Fountains!'],['ferris','🎡','The FERRIS WHEEL!!'],['tower','🏙️','SKYSCRAPERS!!']].sort((a,b)=>T[a[0]].r-T[b[0]].r);
let UNL=UNLOCKS;   // only the unlocks this map actually has
const WSPD={duck:[10,25],dog:[18,42],cat:[8,22],pigeon:[6,16],person:[10,20]};
const CAR_COLS=['#e74c3c','#3498db','#2ecc71','#9b59b6','#f1c40f','#ecf0f1','#ff8c42','#1abc9c'];
const ROOFS=['#c0392b','#8e4b2f','#5d6d7e','#2e4053','#a04000','#b5523b'];
const WALLS=['#ffe6a7','#ffd1dc','#cde7ff','#d5f5d0','#f6e3c6','#e8d9ff'];
const SHOPS=['#ff8a80','#80d8ff','#ffd180','#b9f6ca','#ea80fc','#ffab91'];
const TOWERS=['#7f8c8d','#5d7fa3','#6c7a89','#4f6d7a','#8a8fb0'];
const TOWER_H=[125,155,140,175,148];
const OFFICE_H=[195,215,235],APT_H=[70,86,78],SUPER_H=[360,400];
const VARIANTS={billboard:6,vending:3,person:8,supertall:2,rowhouse:8,diner:3,apartment:3,office:3,car:8,ball:3,tree:4,bush:2,house:6,shop:6,tower:5,flower:3,bike:2,cat:3,dog:3,cart:2,swings:2,slide:2};

/* ================= maps =================
   grid is 7x7 blocks: i = west(0)..east(6), j = north(0)..south(6). Camera looks north. */
const mixDefault=null;
const CITIES={
  town:{name:'Gobble Town',emoji:'🏙️'},
  chicago:{name:'Chicago',emoji:'🌭',water:(i,j)=>i===6||(j===2&&i>=1&&i<=5),
    special:{'2,3':['plaza','willis'],'4,1':['plaza','hancock'],'5,3':['park','bean'],'5,4':['park','buckingham'],'6,1':['fun']},
    mix:(dc,r)=>dc<2?(r<.6?'downtown':r<.88?'shops':'park'):(r<.35?'rows':r<.55?'houses':r<.8?'shops':'park'),
    cars:['car','car','car','car','taxi','icecream','garbage','fire'],bus:'bus'},
  newyork:{name:'New York',emoji:'🗽',water:(i,j)=>i===0||i===6||j===6,
    special:{'2,6':['water','liberty'],'3,3':['plaza','empire'],'4,2':['plaza','chrysler'],'2,2':['times'],'2,0':['park'],'3,0':['park'],'4,0':['park'],'3,1':['park']},

const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_v=new THREE.Vector3(),_s=new THREE.Vector3(),_c=new THREE.Color();
class Parts{
  constructor(){this.list=[];}
  add(geo,color,x=0,y=0,z=0,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1){
    _e.set(rx,ry,rz);_q.setFromEuler(_e);_m.compose(_v.set(x,y,z),_q,_s.set(sx,sy,sz));

    if(g!==geo)geo.dispose();

  box(w,h,d,color,x=0,y=0,z=0,ry=0,rx=0,rz=0){return this.add(new THREE.BoxGeometry(w,h,d),color,x,y+h/2,z,rx,ry,rz);}
  cyl(rt,rb,h,seg,color,x=0,y=0,z=0){return this.add(new THREE.CylinderGeometry(rt,rb,h,seg),color,x,y+h/2,z);}
  ball(r,color,x=0,y=0,z=0,detail=1,sx=1,sy=1,sz=1){return this.add(new THREE.IcosahedronGeometry(r,detail),color,x,y,z,0,0,0,sx,sy,sz);}

    const g=geo.index?geo.toNonIndexed():geo;g.deleteAttribute('uv');g.applyMatrix4(_m);if(g!==geo)geo.dispose();
    this.list.push([g,new THREE.Color(color)]);return this;}
  plane(w,h,color,x,y,z,ry=0){return this.add(new THREE.PlaneGeometry(w,h),color,x,y,z,0,ry);}
  build(){
    let n=0;for(const[g]of this.list)n+=g.attributes.position.count;
    const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;
    for(const[g,c]of this.list){const cnt=g.attributes.position.count;
      pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);
      for(let i=0;i<cnt;i++){col[(o+i)*3]=c.r;col[(o+i)*3+1]=c.g;col[(o+i)*3+2]=c.b;}
      o+=cnt;g.dispose();}
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('normal',new THREE.BufferAttribute(nor,3));
    geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    geo.computeBoundingSphere();return geo;}

function getGeo(k,v){const key=k+'|'+v;let g=geoCache.get(key);if(!g){const p=new Parts();BUILD[k](p,v);g=p.build();geoCache.set(key,g);}return g;}

/* ---------- instancing ---------- */
let imeshes=[];
const dirty=new Set();
let meshByKind=new Map();
const ZERO_M=new THREE.Matrix4().compose(new THREE.Vector3(0,-9999,0),new THREE.Quaternion(),new THREE.Vector3(0,0,0));
function buildInstances(){
  for(const m of imeshes){scene.remove(m);m.dispose();}imeshes=[];meshByKind=new Map();
  const groups=new Map();
  for(const o of objs){const key=o.k+'|'+o.v;let l=groups.get(key);if(!l)groups.set(key,l=[]);l.push(o);}
  for(const[key,list]of groups){const[k,v]=key.split('|');
    const cap=list.length+Math.max(4,Math.ceil(list.length*.6));          // spare slots for things that spawn later
    const im=new THREE.InstancedMesh(getGeo(k,+v),OBJ_MAT,cap);im.v=+v;im.cap=cap;im.slots=list.slice();im.count=list.length;
    im.castShadow=true;im.receiveShadow=true;im.frustumCulled=false;
    list.forEach((o,i)=>{o.im=im;o.ii=i;setInst(o);});
    im.instanceMatrix.needsUpdate=true;scene.add(im);imeshes.push(im);
    let arr=meshByKind.get(k);if(!arr)meshByKind.set(k,arr=[]);arr.push(im);}
}
const _qy=new THREE.Quaternion(),_qt=new THREE.Quaternion(),_ax=new THREE.Vector3(),_up=new THREE.Vector3(0,1,0),_zero=new THREE.Vector3(0,0,0);
function objYaw(o){
  if(o.moving)return o.vert?(o.vy>0?-Math.PI/2:Math.PI/2):(o.vx<0?Math.PI:0);
  if(o.wb&&(o.vx||o.vy))o.yaw=Math.atan2(-o.vy,o.vx);
  return o.yaw;}
// keep each instanced mesh packed: only live objects are drawn, spare capacity costs nothing
function removeInst(o){const im=o.im,last=im.count-1,lo=im.slots[last];
  if(lo!==o){im.slots[o.ii]=lo;lo.ii=o.ii;setInst(lo);}im.slots.length=last;im.count=last;dirty.add(im);}
function setInst(o){objMatrix(o);o.im.setMatrixAt(o.ii,o.ghost&&!o.gone?ZERO_M:_m);dirty.add(o.im);}
function objMatrix(o){
  _qy.setFromAxisAngle(_up,objYaw(o));
  if(o.gone){_m.compose(_v.set(o.x,-9999,o.y),_qy,_zero);}
  else if(o.body||o.pose){let px,py,pz;
    if(o.body){const t=o.body.translation(),r=o.body.rotation();_qt.set(r.x,r.y,r.z,r.w);px=t.x;py=t.y;pz=t.z;}
    else{const P=o.pose;_qt.set(P.q.x,P.q.y,P.q.z,P.q.w);px=P.x;py=P.y;pz=P.z;}
    _v.set(0,-o.h/2,0).applyQuaternion(_qt);_v.x+=px;_v.y+=py;_v.z+=pz;
    const sc=o.eaten?Math.max(.25,1-o.eatT*.7):1;_m.compose(_v,_qt,_s.set(sc,sc,sc));}
  else if(o.fall){const f=o.fall,h=f.h,p=Math.min(1,f.t),e=p*p;
    const k=Math.min(1,p*1.25)*.85,px=o.x+(h.x-o.x)*k,pz=o.y+(h.y-o.y)*k;
    const py=-e*(o.h*1.25+o.r*2+30);
    _ax.set(f.az,0,-f.ax);_qt.setFromAxisAngle(_ax,Math.min(1.5,f.t0+p*2.4));_qt.multiply(_qy);
    const s=1-p*.35;_m.compose(_v.set(px,py,pz),_qt,_s.set(s,s,s));}
  else if(o.tilt){_qt.setFromAxisAngle(_ax.set(o.tdz,0,-o.tdx),o.tilt);
    _v.set(o.x-o.pvx,0,o.y-o.pvz).applyQuaternion(_qt);_v.x+=o.pvx;_v.z+=o.pvz;_qt.multiply(_qy);_m.compose(_v,_qt,_s.set(1,1,1));}
  else{const sc=o.spawnT<1?Math.max(.001,backOut(o.spawnT)):1;_m.compose(_v.set(o.x,0,o.y),_qy,_s.set(sc,sc,sc));}
}

/* ---- levels: growth fills a bar; size only changes on level-up ---- */
// Each level costs 20 points until about level 7, then 21% more per level. Each level = 10% bigger. No top level.
const LSTEP=1.1,LV_COST=L=>Math.round(Math.max(20,6*Math.pow(1.21,Math.min(L,20)-1)*Math.pow(1.08,Math.max(0,L-20))));   // gentler above level 20 so 30+ is reachable   // points to go from level L to L+1
const LV_TOTAL=[0,0];for(let L=1;L<400;L++)LV_TOTAL[L+1]=LV_TOTAL[L]+LV_COST(L);
const lvR=L=>R0*Math.pow(LSTEP,L-1);
const lvPts=L=>LV_TOTAL[Math.min(L,400)];                                  // total points needed to reach level L
const lvOf=xp=>{let L=1;while(L<399&&LV_TOTAL[L+1]<=xp)L++;return L;};
function lvProg(h){return clamp((h.xp-lvPts(h.lvl))/(lvPts(h.lvl+1)-lvPts(h.lvl)),0,1);}
const backOut=t=>{const c=1.9;t-=1;return 1+(c+1)*t*t*t+c*t*t;};
function setLevel(h,L){h.lvl=Math.max(1,L);h.xp=lvPts(h.lvl);h.r=h.rTo=lvR(h.lvl);h.lvT=1;}
function grow(h,pts){h.xp+=pts;const L=lvOf(h.xp);
  if(L>h.lvl){h.lvl=L;h.rFrom=h.r;h.rTo=lvR(L);h.lvT=0;h.chomp=1;
    if(h===player){addPopup(h.x,h.y,'LEVEL UP! ⬆️','#ffd23a',h);lvlSound();buzz(30);shake=Math.max(shake,6);}}}
function mkHole(name,color,bot){return{xp:0,lvl:1,rTo:R0,rFrom:R0,lvT:1,name,color,bot,x:0,y:0,r:R0,score:0,alive:true,respawn:0,dx:0,dy:0,think:0,target:null,wx:0,wy:0,spd:bot?rnd(.82,1):1};}
function spawn(h){
  for(let t=0;t<40;t++){const i=ri(0,N),c=ROAD/2+i*(BLOCK+ROAD),p=rnd(150,W-150);

function showMsg(t,s){const e=$('msg');e.textContent=t;e.style.display='block';msgT=s;}
function rank(){return holes.slice().sort((a,b)=>b.score-a.score);}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
function endGame(){
  state='over';clearBanners();const rk=rank(),pos=rk.indexOf(player)+1;
  const medal=['🥇','🥈','🥉'];
  $('place').textContent=pos===1?'🏆 You WON!':pos<=3?medal[pos-1]+' You got #'+pos+'!':'You got #'+pos+'!';
  let best=0;try{best=+localStorage.getItem('gobblePhysBest')||0;if(player.score>best)localStorage.setItem('gobblePhysBest',player.score);}catch(e){}

  $('results').innerHTML=rk.map((h,i)=>`<div class="${h===player?'me':''}"><span>${medal[i]||(i+1)+'.'} <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${h.color}"></span> ${esc(h.name)}</span><span>${h.score}</span></div>`).join('');

function updateHud(){
  const m=Math.max(0,Math.ceil(timeLeft)),t=$('timer');t.textContent=Math.floor(m/60)+':'+String(m%60).padStart(2,'0');t.classList.toggle('low',m<=10);

  const rk=rank();let html='';rk.slice(0,6).forEach((h,i)=>{html+=`<div class="${h===player?'me':''}"><span><span class="dot" style="background:${h.color}"></span>${i===0?'👑 ':''}${esc(h.name)}</span><span>${h.score}</span></div>`;});

/* ---------- popups (DOM) ---------- */
function addPopup(x,y,txt,col,big){if(popups.length>14&&!big)return;
  if(big&&big.x!==undefined){for(const p of popups)if(p.h===big)p.t=1;}const el=document.createElement('div');el.className='pop'+(big?' big':'');el.textContent=txt;el.style.color=col||'#fff';
  $('labels').appendChild(el);popups.push({x,y,t:0,el,h:big&&big.x!==undefined?big:null});}

/* ================= AI ================= */
function think(b){
  let fx=0,fy=0,bestT=null,bestS=0;
  for(const h of holes){if(h===b||!h.alive)continue;const dx=h.x-b.x,dy=h.y-b.y,d=Math.hypot(dx,dy)||1;
    if(h.r>b.r*1.15&&d<h.r+230){fx-=dx/d*(h.r+230-d);fy-=dy/d*(h.r+230-d);}
    else if(b.r>h.r*1.15&&d<340&&!(mode==='easy'&&h===player)){const s=(30+h.r)/(d+40);if(s>bestS){bestS=s;bestT=h;}}}
  if(fx||fy){const m=Math.hypot(fx,fy);b.dx=fx/m;b.dy=fy/m;b.target=null;return;}
  const lim=b.r*.92;
  for(const o of objs){if(o.eaten||o.r>=lim)continue;const dx=o.x-b.x,dy=o.y-b.y;if(dx>430||dx<-430||dy>430||dy<-430)continue;
    const d=Math.hypot(dx,dy),s=(o.pts+o.r*.4)/(d+40);if(s>bestS){bestS=s;bestT=o;}}
  if(bestT&&Math.random()<(mode==='easy'?.6:.75)){b.target=bestT;return;}
  b.target=null;if(Math.hypot(b.wx-b.x,b.wy-b.y)<60||!b.wx||Math.random()<.15){b.wx=rnd(100,W-100);b.wy=rnd(100,W-100);}
  const dx=b.wx-b.x,dy=b.wy-b.y,m=Math.hypot(dx,dy)||1;b.dx=dx/m;b.dy=dy/m;
}

/* ================= spawning during the round ================= */
const SPAWN_SMALL={plaza:['person','person','person','pigeon','flower','bench','trash'],mall:['person','person','person','pigeon','tree'],

  rows:['person','person','ball','flower','cat','bike','trash','bush','tree'],shops:['person','person','person','pigeon','trash','flower','bike','cone','cart','dumpster','phone','bench'],
  downtown:['person','person','person','pigeon','trash','flower','cone','dumpster','phone','bike'],fun:['person','person','ball','pigeon','cart','flower','picnic'],civic:['person','person','ball','bike','dog','tree','picnic','flower']};
const SPAWN_BLD={houses:['house','house','rowrow','apartment'],rows:['rowrow','rowrow','house'],shops:['shop','diner','gas'],downtown:['office','tower','apartment','shop']};
let spawnClk=0,bldClk=0,carClk=0,startCount=0,startCars=0;
function spawnObj(k,x,y,extra){const ms=(meshByKind.get(k)||[]).filter(m=>m.count<m.cap);if(!ms.length)return null;
  const im=pick(ms);const o=mk(k,x,y,Object.assign({v:im.v},extra||{}));o.im=im;o.ii=im.count;im.slots[o.ii]=o;im.count++;o.spawnT=0;setInst(o);return o;}
let spawnedCount=0;
function overlaps(o,x,y,w,d){return Math.abs(o.x-x)<(o.w+w)/2+4&&Math.abs(o.y-y)<(o.d+d)/2+4;}
function clearSpot(x,y,w,d,ignoreSmall){if(x-w/2<0||y-d/2<0||x+w/2>W||y+d/2>W)return false;
  for(const h of holes)if(h.alive&&Math.hypot(h.x-x,h.y-y)<h.r+Math.max(w,d)/2+40)return false;
  for(const o of objs)if(!o.fall&&!(ignoreSmall&&o.r<15&&!o.moving)&&overlaps(o,x,y,w,d))return false;return true;}
function clearClutter(x,y,w,d){let n=0;for(const o of objs)if(!o.body&&!o.gone&&o.r<15&&!o.moving&&overlaps(o,x,y,w,d)){o.gone=true;removeInst(o);n++;}
  if(n)objs=objs.filter(o=>!o.gone);}
function spawnSmall(){const b=pick(blocks),pool=SPAWN_SMALL[b.type];if(!pool)return;const k=pick(pool),t=T[k];
  const x0=b.x+16,y0=b.y+16,x1=b.x+BLOCK-16,y1=b.y+BLOCK-16;
  for(let i=0;i<6;i++){const x=rnd(x0+t.w/2,x1-t.w/2),y=rnd(y0+t.d/2,y1-t.d/2);if(!clearSpot(x,y,t.w,t.d))continue;
    spawnObj(k,x,y,WSPD[k]?{wb:[x0,y0,x1,y1],moveT:0}:null);spawnedCount++;return;}}
function spawnBuilding(){const bs=blocks.filter(b=>SPAWN_BLD[b.type]);if(!bs.length)return;const b=pick(bs),k=pick(SPAWN_BLD[b.type]);
  const x0=b.x+16,y0=b.y+16,cs=(BLOCK-32)/2;
  for(const[ci,cj]of[[0,0],[1,0],[0,1],[1,1]].sort(()=>Math.random()-.5)){const cx=x0+(ci+.5)*cs,cy=y0+(cj+.5)*cs;
    if(k==='rowrow'){if(!clearSpot(cx,cy,27*5,46,true))continue;clearClutter(cx,cy,27*5,46);for(let n=0;n<5;n++)spawnObj('rowhouse',cx-54+n*27,cy);spawnedCount+=5;return;}
    if(clearSpot(cx,cy,T[k].w,T[k].d,true)){clearClutter(cx,cy,T[k].w,T[k].d);if(spawnObj(k,cx,cy))spawnedCount++;return;}}}
function spawnCar(){const i=ri(0,N),c=ROAD/2+i*(BLOCK+ROAD),vert=Math.random()<.5,lane=pick([-1,1]),k=pick(['car','car','car','car','bus','icecream','garbage','fire']);
  const p=rnd(40,W-40),x=vert?c+lane*18:p,y=vert?p:c+lane*18;
  for(const o of objs)if(o.moving&&Math.abs(o.x-x)<90&&Math.abs(o.y-y)<90)return;
  for(const h of holes)if(h.alive&&Math.hypot(h.x-x,h.y-y)<h.r+90)return;
  const sp=rnd(45,85)*lane;if(spawnObj(k,x,y,vert?{vert,moving:true,vy:sp}:{vert,moving:true,vx:sp}))spawnedCount++;}
function runSpawner(dt){const f=1-timeLeft/roundLen;
  // more and more appears as the round goes on
  spawnClk-=dt;while(spawnClk<=0){spawnClk+=1/(4+14*f);if(objs.length<startCount*1.1)spawnSmall();}
  carClk-=dt;while(carClk<=0){carClk+=.25;if(objs.filter(o=>o.moving).length<startCars)spawnCar();}
  bldClk-=dt;while(bldClk<=0){bldClk+=Math.max(.6,2.6-2.2*f);if(f>.1)spawnBuilding();}}

/* ================= physics (Rapier) =================
   Only things near a mouth are simulated. Each mouth carries a ring-shaped piece of
   ground with a real opening in it; things too big to fit also hit a "lid" a little
   way down, so they wedge and tip instead of falling through.               */
const GRAV=-260,PSTEP=1/60,MAX_ACTIVE=120,RING_OUT=460;
let world=null,pAcc=0;const active=new Set();
const G_OBJ=1,grp=(mem,f)=>((mem&0xffff)<<16)|(f&0xffff),ringBit=i=>1<<(1+i),lidBit=i=>1<<(7+i);
const lidDepth=h=>clamp(h.r*.45,6,70);
function initPhysics(){if(world)world.free();world=new RAPIER.World({x:0,y:GRAV,z:0});world.timestep=PSTEP;active.clear();pAcc=0;
  holes.forEach((h,i)=>{h.idx=i;h.pb=world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(h.x,0,h.y));h.pcols=[];buildRing(h);});}
function buildRing(h){for(const c of h.pcols)world.removeCollider(c,false);h.pcols=[];
  // ground around a mouth: a sloped lip (things resting on it lean and slide in), then flat ground
  const N=28,TH=14,r=h.r*1.18,wf=Math.max(10,h.r*.45),Rf=r+wf,sd=wf*.6,R1=r+RING_OUT,gs=grp(ringBit(h.idx),G_OBJ);
  const wedge=(Ra,ya,Rb,yb,a0,a1)=>{const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    return new Float32Array([Ra*c0,ya,Ra*s0,Ra*c1,ya,Ra*s1,Rb*c0,yb,Rb*s0,Rb*c1,yb,Rb*s1,Ra*c0,ya-TH,Ra*s0,Ra*c1,ya-TH,Ra*s1,Rb*c0,yb-TH,Rb*s0,Rb*c1,yb-TH,Rb*s1]);};
  for(let k=0;k<N;k++){const a0=k/N*TAU,a1=(k+1)/N*TAU;
    h.pcols.push(world.createCollider(RAPIER.ColliderDesc.convexHull(wedge(r,-sd,Rf,0,a0,a1)).setFriction(.2).setCollisionGroups(gs),h.pb));
    h.pcols.push(world.createCollider(RAPIER.ColliderDesc.convexHull(wedge(Rf,0,R1,0,a0,a1)).setFriction(.9).setCollisionGroups(gs),h.pb));}
  const ld=lidDepth(h);
  h.pcols.push(world.createCollider(RAPIER.ColliderDesc.cylinder(4,h.r*1.22).setTranslation(0,-ld-4,0).setFriction(.9).setCollisionGroups(grp(lidBit(h.idx),G_OBJ)),h.pb));
  h.pR=h.r;}
const tooBig=(o,h)=>o.r>=h.rTo*.92;
// lowest corner of an object's box (world y)
function lowestY(o,t,q){const m10=2*(q.x*q.y+q.w*q.z),m11=1-2*(q.x*q.x+q.z*q.z),m12=2*(q.y*q.z-q.w*q.x);
  return t.y-(Math.abs(m10)*o.t.w/2+Math.abs(m11)*o.h/2+Math.abs(m12)*o.t.d/2);}
// is any part of it over some mouth's opening or sloped lip?
function overAnyMouth(o,t){for(const h of holes){if(!h.alive)continue;const lip=h.r*1.18+Math.max(10,h.r*.45);
  if(Math.hypot(t.x-h.x,t.z-h.y)<lip+o.r/.75)return true;}return false;}
const groupsFor=(o,h)=>grp(G_OBJ,G_OBJ|ringBit(h.idx)|(tooBig(o,h)?lidBit(h.idx):0));
function restPose(o){if(o.pose)return o.pose;_qy.setFromAxisAngle(_up,objYaw(o));return{x:o.x,y:o.h/2,z:o.y,q:{x:_qy.x,y:_qy.y,z:_qy.z,w:_qy.w}};}
window.__dbg={act:0,eat:0,reset:0,deact:0,stuck:0};
function activate(o,h){__dbg.act++;const p=restPose(o);
  const bd=RAPIER.RigidBodyDesc.dynamic().setTranslation(p.x,p.y,p.z).setRotation(p.q).setLinearDamping(.15).setAngularDamping(.6).setCanSleep(true);
  if(o.r<9)bd.setCcdEnabled(true);
  if(o.moving||o.wb)bd.setLinvel(o.vx||0,0,o.vy||0);
  o.body=world.createRigidBody(bd);
  o.col=world.createCollider(RAPIER.ColliderDesc.cuboid(o.t.w/2,o.h/2,o.t.d/2).setDensity(o.r>30?.5:1).setFriction(.75).setRestitution(.08).setCollisionGroups(groupsFor(o,h)),o.body);
  o.hole=h;o.big=tooBig(o,h);active.add(o);
  if(o.moving){o.lane={vert:o.vert,vx:o.vx,vy:o.vy,c:o.vert?o.x:o.y};o.moving=false;}
  if(o.wb){o.wander=o.wb;o.wb=null;}}
function deactivate(o){__dbg.deact++;const t=o.body.translation(),q=o.body.rotation();world.removeRigidBody(o.body);o.body=null;o.col=null;active.delete(o);
  o.x=t.x;o.y=t.z;const up=1-2*(q.x*q.x+q.z*q.z);
  if(up>.97&&t.y>-1){o.pose=null;o.yaw=2*Math.atan2(q.y,q.w);
    if(o.lane){const ly=o.lane.vert?(o.lane.vy>0?-Math.PI/2:Math.PI/2):(o.lane.vx<0?Math.PI:0);let dy=Math.atan2(Math.sin(o.yaw-ly),Math.cos(o.yaw-ly));
      const off=(o.lane.vert?o.x:o.y)-o.lane.c;
      if(Math.abs(dy)<.3&&Math.abs(off)<10){if(o.lane.vert)o.x=o.lane.c;else o.y=o.lane.c;o.vx=o.lane.vx;o.vy=o.lane.vy;o.moving=true;}}
    else if(o.wander){o.wb=o.wander;o.vx=o.vy=0;o.moveT=rnd(.5,1.5);}}
  else{o.pose={x:t.x,y:Math.max(t.y,.5),z:t.z,q:{x:q.x,y:q.y,z:q.z,w:q.w}};}
  setInst(o);}
function creditEat(o,h){__dbg.eat++;h.score+=o.pts;h.chomp=Math.min(1,h.chomp+(o.r>h.r*.25?1:.45));grow(h,o.pts);
  if(h===player){sfx(o.r);if(!pend.pts)pend.t=.4;pend.pts+=o.pts;if(o.r>30){buzz(25);shake=Math.min(8,o.r*.07);}}}
function nearestHole(o){let best=null,bd=1e9;for(const h of holes){if(!h.alive)continue;const d=Math.hypot(h.x-o.x,h.y-o.y)-h.r;if(d<bd){bd=d;best=h;}}return[best,bd];}
function stepPhysics(dt){
  // move each mouth's ring of ground (teleport: no dragging of things sitting on it)
  for(const h of holes){if(!h.pb)continue;
    if(Math.abs(h.r-h.pR)>h.pR*.03)buildRing(h);
    h.pb.setTranslation({x:h.x,y:h.alive?0:-50000,z:h.y},true);}
  // wake up things a mouth has reached
  for(const h of holes){if(!h.alive)continue;const reach=h.r+30,tiny=h.rTo*.2;
    for(const o of objs){if(o.body||o.gone||o.fall||o.spawnT<1)continue;const rr=reach+o.r;
      const dx=o.x-h.x,dy=o.y-h.y;if(dx>rr||dx<-rr||dy>rr||dy<-rr)continue;const d2=dx*dx+dy*dy;if(d2>rr*rr)continue;
      if(o.r<tiny){const m=h.r*1.1-o.r*.4;if(d2<m*m){o.pose=null;o.eaten=true;startFall(o,h);creditEat(o,h);}continue;}
      if(active.size<MAX_ACTIVE)activate(o,h);}}
  let anyFell=false;
  for(const o of objs)if(o.fall){o.fall.t+=dt/o.fall.dur;if(o.fall.t>=1){o.gone=true;anyFell=true;removeInst(o);}}
  if(anyFell)objs=objs.filter(o=>!o.gone);
  // the ground under a sleeping body can move away (the mouth slid under it): keep those awake
  for(const o of active){if(o.eaten||!o.body.isSleeping())continue;const h=o.hole;if(!h.alive)continue;
    const d=Math.hypot(o.x-h.x,o.y-h.y);if(d<h.r+o.r+8)o.body.wakeUp();}
  pAcc+=dt;let n=0;while(pAcc>=PSTEP&&n<3){applySuck();world.step();pAcc-=PSTEP;n++;}if(n===3)pAcc=0;
  let anyGone=false;
  for(const o of active){const t=o.body.translation();o.x=t.x;o.y=t.z;
    if(o.eaten){o.eatT+=dt;if(o.eatT>1.1||t.y<-700){world.removeRigidBody(o.body);o.body=null;active.delete(o);o.gone=true;removeInst(o);anyGone=true;}continue;}
    let h=o.hole;
    if(!h.alive){if(t.y<-2){o.eaten=true;o.eatT=0;o.col.setCollisionGroups(grp(G_OBJ,0));}else deactivate(o);continue;}
    // switch to a closer mouth while still standing on the ground
    const[nh,nd]=nearestHole(o);
    if(nh&&nh!==h&&t.y>o.h*.3&&nd<Math.hypot(h.x-o.x,h.y-o.y)-h.r-4){o.hole=h=nh;o.big=tooBig(o,h);o.col.setCollisionGroups(groupsFor(o,h));}
    const big=tooBig(o,h);if(big!==o.big){o.big=big;o.col.setCollisionGroups(groupsFor(o,h));}
    const q=o.body.rotation(),low=lowestY(o,t,q);
    // left behind partly underground (the mouth moved away): ease it back up onto the street
    if(low<-.8&&!overAnyMouth(o,t)){o.body.setTranslation({x:t.x,y:t.y+Math.min(-low,1.5-low*.3),z:t.z},true);
      const v=o.body.linvel();o.body.setLinvel({x:v.x*.8,y:Math.max(0,v.y),z:v.z*.8},true);continue;}
    // something that fits but is jammed in the opening or on the lip: let it drop
    if(!big){const dc=Math.hypot(t.x-h.x,t.z-h.y);
      if(dc<h.r*1.2&&low<-1&&o.body.linvel().y>-8){o.stuckT=(o.stuckT||0)+dt;if(o.stuckT>.6){o.col.setCollisionGroups(grp(G_OBJ,0));o.stuckT=0;}}
      else o.stuckT=0;}
    // fell below the ground: inside a mouth = eaten; outside one = put it back
    if(!big&&t.y<-(o.h*.5)-3){
      if(Math.hypot(t.x-h.x,t.z-h.y)<h.r*1.25+o.r){o.eaten=true;o.eatT=0;o.col.setCollisionGroups(grp(G_OBJ,0));creditEat(o,h);}
      else{__dbg.reset++;(__dbg.rl=__dbg.rl||[]).length<6&&__dbg.rl.push([o.k,h.name,Math.hypot(t.x-h.x,t.z-h.y).toFixed(1),h.r.toFixed(1),t.y.toFixed(1)]);o.body.setTranslation({x:t.x,y:o.h/2+1,z:t.z},true);o.body.setLinvel({x:0,y:0,z:0},true);o.body.setAngvel({x:0,y:0,z:0},true);}
      continue;}
    // fall back asleep once every mouth has moved on
    if(nd>o.r+70&&t.y>-2&&low>-.8){const v=o.body.linvel(),w=o.body.angvel();
      if(o.body.isSleeping()||(v.x*v.x+v.y*v.y+v.z*v.z<9&&w.x*w.x+w.y*w.y+w.z*w.z<.4))deactivate(o);}}
  if(anyGone)objs=objs.filter(o=>!o.gone);
}
// The mouth "sucks": things overlapping it are pushed down at the edge nearest the
// mouth (so they tip in) and things that fit are also drawn toward the middle.
const _imp={x:0,y:0,z:0},_pt={x:0,y:0,z:0};
function applySuck(){for(const o of active){if(o.eaten)continue;const h=o.hole;if(!h.alive)continue;
  const t=o.body.translation(),dx=h.x-t.x,dz=h.y-t.z,d=Math.hypot(dx,dz)||.01;
  const e=clamp((h.r+o.r*.5-d)/(o.r+h.r*.5),0,1);if(e<=0)continue;
  const ux=dx/d,uz=dz/d,m=o.body.mass(),reach=Math.min(d,o.r*.75);
  _pt.x=t.x+ux*reach;_pt.y=t.y-o.h*.4;_pt.z=t.z+uz*reach;
  const down=(o.big?200:300)*e*m*PSTEP,side=o.big?0:150*e*m*PSTEP;
  _imp.x=ux*side;_imp.y=-down;_imp.z=uz*side;o.body.applyImpulseAtPoint(_imp,_pt,true);}}
function holeDied(b){for(const o of active)if(o.hole===b&&!o.eaten){const t=o.body.translation();if(t.y<-2){o.eaten=true;o.eatT=0;o.col.setCollisionGroups(grp(G_OBJ,0));}else deactivate(o);}}

/* ================= update ================= */
function startFall(o,h){const dx=h.x-o.x,dy=h.y-o.y,d=Math.hypot(dx,dy);
  let ax,az;if(d>1){ax=dx/d;az=dy/d;}else{const a=rnd(0,TAU);ax=Math.cos(a);az=Math.sin(a);}
  o.fall={h,t:0,dur:.5+o.r*.007,ax,az,t0:Math.max(0,o.tilt)};}
function eatHole(a,b){
  const bonus=25+Math.round(b.r);a.score+=bonus;a.chomp=1;grow(a,bonus);
  b.alive=false;b.respawn=2.5;holeDied(b);setLevel(b,b.lvl-4);b.target=null;
  if(a===player){addPopup(b.x,b.y,'Gobbled '+b.name+'!',a.color);sfx(0,'big');buzz(40);shake=12;}
  if(b===player){showMsg('Oh no! '+a.name+' gobbled you!\nBack in a sec…',2.5);sfx(0,'big');buzz(120);}
}
function update(dt){
  for(const o of objs){if(o.fall||o.body||o.pose)continue;
    if(o.moving){o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x>W+40)o.x=-40;if(o.x<-40)o.x=W+40;if(o.y>W+40)o.y=-40;if(o.y<-40)o.y=W+40;}
    else if(o.wb){o.moveT-=dt;if(o.moveT<=0){o.moveT=rnd(.5,2);const a=rnd(0,TAU),sp=WSPD[o.k]||WSPD.duck,s=Math.random()<.3?0:rnd(sp[0],sp[1]);o.vx=Math.cos(a)*s;o.vy=Math.sin(a)*s;}
      o.x=clamp(o.x+o.vx*dt,o.wb[0]+6,o.wb[2]-6);o.y=clamp(o.y+o.vy*dt,o.wb[1]+6,o.wb[3]-6);}}
  if(state!=='play'){cam.x+=dt*22;cam.y+=dt*10;if(cam.x>W-350)cam.x=350;if(cam.y>W-350)cam.y=350;cam.D=targetD(55);return;}
  timeLeft-=dt;if(timeLeft<=0){timeLeft=0;updateHud();endGame();return;}
  for(const h of holes){
    if(!h.alive){h.respawn-=dt;if(h.respawn<=0){spawn(h);if(h===player)$('msg').style.display='none';}continue;}
    let dx,dy;
    if(h.bot){h.think-=dt;if(h.think<=0){h.think=rnd(.3,.5);think(h);}
      if(h.target){if(h.target.eaten||h.target.gone||h.target.alive===false){h.target=null;h.think=0;dx=h.dx;dy=h.dy;}
        else{const tx=h.target.x-h.x,ty=h.target.y-h.y,m=Math.hypot(tx,ty)||1;dx=tx/m;dy=ty/m;if(m<3){dx=0;dy=0;}h.dx=dx;h.dy=dy;}}
      else{dx=h.dx;dy=h.dy;}
      const mul=(mode==='easy'?.72:.92)*h.spd;dx*=mul;dy*=mul;}
    else{[dx,dy]=inputDir();}
    h.mvx+=(dx-h.mvx)*Math.min(1,dt*6);h.mvy+=(dy-h.mvy)*Math.min(1,dt*6);
    if(h.lvT<1){h.lvT=Math.min(1,h.lvT+dt/.45);h.r=h.rFrom+(h.rTo-h.rFrom)*backOut(h.lvT);}
    h.chomp=Math.max(0,h.chomp-dt*4);h.blink-=dt;if(h.blink<0)h.blink=rnd(2,5);
    const sp=100+h.r*1.6;
    h.x=clamp(h.x+dx*sp*dt,h.r*.5,W-h.r*.5);h.y=clamp(h.y+dy*sp*dt,h.r*.5,W-h.r*.5);
  }
  stepPhysics(dt);
  if(pend.pts){pend.t-=dt;if(pend.t<=0){addPopup(player.x,player.y,'+'+pend.pts);pend.pts=0;}}
  for(const[k,em,txt]of UNL)if(!unlocked.has(k)&&T[k].r<player.rTo*.92){unlocked.add(k);toast(em+' '+txt);chime();}
  for(const a of holes)for(const b of holes){if(a===b||!a.alive||!b.alive||a.r<=b.r*1.15)continue;
    if(mode==='easy'&&b===player)continue;
    if(Math.hypot(a.x-b.x,a.y-b.y)<a.r-b.r*.5)eatHole(a,b);}
  runSpawner(dt);
  // follow the player, but stop at the edge of town so the city always fills the screen
  const Dn=cam.D,hw=Dn*.36*Math.max(.45,Math.min(1.6,camera.aspect)),nearZ=Dn*.33,farZ=Dn*.45;
  const tx=hw*2<W?clamp(player.x,hw,W-hw):W/2,ty=nearZ+farZ<W?clamp(player.y,farZ,W-nearZ):W/2;
  cam.x+=(tx-cam.x)*Math.min(1,dt*3.5);cam.y+=(ty-cam.y)*Math.min(1,dt*3.5);
  cam.D+=(targetD(player.rTo)-cam.D)*Math.min(1,dt*2.2);
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('show');}
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.display='none';}
  boardT-=dt;if(boardT<=0){boardT=.25;updateHud();}
}

/* ================= render sync ================= */
const PITCH=THREE.MathUtils.degToRad(47);
const _p=new THREE.Vector3();
let shadowHalf=0;
function toScreen(x,y,z){_p.set(x,y,z).project(camera);return _p.z>1?null:[(_p.x+1)/2*CW,(1-_p.y)/2*CH];}
function syncScene(now,dt){
  for(const o of objs){if(o.spawnT<1)o.spawnT=Math.min(1,o.spawnT+dt*2.2);if(o.body||o.fall||o.moving||o.spawnT<1||(o.wb&&(o.vx||o.vy)))setInst(o);}
  updateGhosts(dt);
  for(const im of dirty)im.instanceMatrix.needsUpdate=true;dirty.clear();
  shake=Math.max(0,shake-dt*20);
  const sx=shake?(Math.random()-.5)*shake:0,sz=shake?(Math.random()-.5)*shake:0;
  const D=cam.D,cx=cam.x+sx,cz=cam.y+sz;
  camera.position.set(cx,D*Math.sin(PITCH),cz+D*Math.cos(PITCH));camera.lookAt(cx,0,cz);
  scene.fog.near=D*1.5;scene.fog.far=D*3.4;camera.near=clamp(D*.04,10,220);camera.far=D*3+1500;camera.updateProjectionMatrix();
  // sun follows the view
  const half=Math.round(D*.8*Math.max(1,camera.aspect)/50)*50+150;
  if(half!==shadowHalf){shadowHalf=half;const sc=sun.shadow.camera;sc.left=-half;sc.right=half;sc.top=half;sc.bottom=-half;sc.updateProjectionMatrix();
    sun.shadow.normalBias=clamp(2*half/sun.shadow.mapSize.x*1.2,.6,6);}
  // snap the shadow to its own pixel grid so it doesn't shimmer as the camera glides
  const texel=2*shadowHalf/sun.shadow.mapSize.x,scx=Math.round(cx/texel)*texel;
  const tz=Math.round((cz-D*.3)/texel)*texel;sun.target.position.set(scx,0,tz);sun.position.set(scx+SUN_DIR.x*1400,SUN_DIR.y*1400,tz+SUN_DIR.z*1400);
  // holes & labels
  const lead=rank()[0];
  for(const h of holes){syncHole(h,now);
    if(state==='play'&&h.alive&&h.m){const s=toScreen(h.x,h.r*1.02,h.y-h.r*.95);
      if(s){const m=h.m,el=m.el;
        const name=(h===lead&&lead.score>0?'👑 ':'')+h.name;if(m.nm._t!==name){m.nm.textContent=name;m.nm._t=name;}
        const lvl=h.lvl,prog=lvProg(h);
        if(m.lv._t!==lvl){m.lv.textContent=lvl;m.lv._t=lvl;}
        const pw=Math.round(prog*100);if(m.fill._t!==pw){m.fill.style.width=pw+'%';m.fill._t=pw;}
        let cls='hl',nx='';
        if(h===player){cls+=' me';const nu=UNL.find(u=>!unlocked.has(u[0]));nx=nu?nu[1]:'⭐';}
        else if(player&&player.alive&&player.rTo>h.rTo*1.15){cls+=' prey';nx='😋';}
        else if(player&&mode==='normal'&&h.rTo>player.rTo*1.15){cls+=' danger';nx='⚠️';}
        if(el._c!==cls){el.className=cls;el._c=cls;}if(m.nx._t!==nx){m.nx.textContent=nx;m.nx._t=nx;}
        el.style.display='flex';el.style.transform=`translate(${s[0]}px,${s[1]}px) translate(-50%,-100%)`;}
      else h.m.el.style.display='none';}}
  for(const p of popups){p.t+=dt*(p.h?.65:1);const s=p.h?toScreen(p.h.x,p.h.r*1.02,p.h.y-p.h.r*.95):toScreen(p.x,10,p.y);
    if(s){p.el.style.transform=`translate(${s[0]}px,${s[1]-(p.h?45+p.t*40:p.t*55+20)}px) translate(-50%,-50%) scale(${p.h?Math.min(1,.6+p.t*3):1})`;p.el.style.opacity=p.h?Math.min(1,(1-p.t)*2.5):1-p.t;}}
  if(popups.some(p=>p.t>=1)){for(const p of popups)if(p.t>=1)p.el.remove();popups=popups.filter(p=>p.t<1);}
  // joystick
  const show=touch&&state==='play';$('joy').style.display=$('knob').style.display=show?'block':'none';
  if(show){$('joy').style.left=touch.ox+'px';$('joy').style.top=touch.oy+'px';$('knob').style.left=touch.x+'px';$('knob').style.top=touch.y+'px';$('knob').style.background=myColor;}
}

/* ---------- see-through: tall things blocking your monster fade out ---------- */
const ghostPool=[];
for(let i=0;i<12;i++){const g=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshLambertMaterial({vertexColors:true,transparent:true,opacity:.3,depthWrite:false}));
  g.matrixAutoUpdate=false;g.visible=false;g.castShadow=true;g.frustumCulled=false;g.renderOrder=5;scene.add(g);ghostPool.push(g);}
const ghosted=new Set();
function updateGhosts(dt){const h=player,want=new Set();
  if(state==='play'&&h&&h.alive){const tp=Math.tan(PITCH),nearZ=h.y+h.r*.35;
    for(const o of objs){if(o.eaten||o.pose||o.h<20||o.spawnT<1)continue;
      if(Math.abs(o.x-h.x)>o.w/2+h.r*.95)continue;
      if(Math.hypot(o.x-h.x,o.y-h.y)<h.r*1.2+o.r*.3)continue;     // it's going into the mouth: keep it visible
      if(o.y+o.d/2<h.y-h.r*.3)continue;                       // entirely behind the mouth
      if((o.y-o.d/2)-nearZ>o.h/tp)continue;                   // too short to reach the sight line
      want.add(o);}}
  for(const o of want)if(!ghosted.has(o)&&ghosted.size<ghostPool.length)ghosted.add(o);
  for(const o of ghosted){if(o.eaten||o.gone){o.ghost=false;o.gf=0;ghosted.delete(o);if(!o.gone)setInst(o);continue;}
    const tg=want.has(o)?1:0;o.gf=(o.gf||0)+(tg-(o.gf||0))*Math.min(1,dt*7);
    if(tg===0&&o.gf<.04){o.gf=0;o.ghost=false;ghosted.delete(o);setInst(o);}else if(!o.ghost){o.ghost=true;setInst(o);}}
  let i=0;for(const o of ghosted){const gm=ghostPool[i++];gm.geometry=o.im.geometry;objMatrix(o);gm.matrix.copy(_m);gm.matrixWorldNeedsUpdate=true;
    gm.material.opacity=1-(o.h>200?.93:.84)*o.gf;gm.visible=true;}
  for(;i<ghostPool.length;i++)ghostPool[i].visible=false;}

/* ---------- automatic quality: step down if the device struggles ---------- */
const QUALITY=[{pr:1,sh:0},{pr:1,sh:1024},{pr:Math.min(1.5,DPR),sh:2048},{pr:DPR,sh:2048}];
let qLevel=3,qualityClock=0,qFrames=0,qTime=0;
function applyQuality(){const q=QUALITY[qLevel];renderer.setPixelRatio(q.pr);renderer.setSize(CW,CH);
  const on=q.sh>0;if(on!==renderer.shadowMap.enabled){renderer.shadowMap.enabled=on;sun.castShadow=on;OBJ_MAT.needsUpdate=true;groundMat.needsUpdate=true;outer.material.needsUpdate=true;}
  if(on&&sun.shadow.mapSize.x!==q.sh){sun.shadow.mapSize.set(q.sh,q.sh);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}}
function watchQuality(dt){if(window.__noAuto||state!=='play'||qLevel===0)return;qualityClock+=dt;if(qualityClock<0)return;qFrames++;qTime+=dt;
  if(qTime>=2){const avg=qTime/qFrames;qFrames=0;qTime=0;if(avg>1/42){qLevel--;applyQuality();}}}

/* ================= main loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);syncScene(now,dt);renderer.render(scene,camera);watchQuality(dt);
  requestAnimationFrame(frame);
}

/* ================= menu wiring ================= */
const sw=$('swatches');
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;b.onclick=()=>{myColor=c;[...sw.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');};sw.appendChild(b);});
function optGroup(id,fn){const el=$(id);el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset.v);});}
optGroup('modes',v=>mode=v);
optGroup('maps',v=>{cityId=v;city=CITIES[v];try{localStorage.setItem('gobbleMap',v);}catch(e){}newTown();});
$('maps').querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',b.dataset.v===cityId));optGroup('lens',v=>roundLen=+v);
function showBest(){try{const b=+localStorage.getItem('gobblePhysBest');if(b)$('best').textContent='⭐ Best score: '+b;}catch(e){}}
try{const n=localStorage.getItem('gobbleName');if(n)$('name').value=n;}catch(e){}showBest();
$('play').onclick=()=>{initAudio();try{localStorage.setItem('gobbleName',$('name').value);}catch(e){}newGame();};
$('again').onclick=()=>{initAudio();newGame();};
$('toMenu').onclick=()=>{$('over').classList.add('hidden');$('menu').classList.remove('hidden');$('mute').classList.add('hidden');state='menu';
  for(const h of holes)disposeHole(h);holes=[];clearPopups();showBest();};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';};
$('name').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')$('play').click();});
document.addEventListener('visibilitychange',()=>{last=performance.now();});

newTown();cam.D=targetD(55);
RAPIER.init().then(()=>{$('play').disabled=false;$('play').textContent='PLAY!';}).catch(()=>{$('play').textContent='Physics failed to load — try reloading';});
requestAnimationFrame(t=>{last=t;frame(t);});
window.__t={get holes(){return holes},get player(){return player},get objs(){return objs},get q(){return qLevel},renderer,setLevel,lvPts,get spawned(){return spawnedCount},get active(){return active},get world(){return world},tick(n){for(let i=0;i<n;i++)update(1/60);}};
</script>
