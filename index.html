<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GeoGeniuses">
<title>GeoGeniuses</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@400;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Geo<b>Geniuses</b></div>
    <div class="meta"><span id="dateLabel"></span><button id="soundBtn" class="icon-btn" aria-label="Sound on">🔊</button><button id="whoBtn" class="who" hidden></button></div>
  </header>

  <!-- Name picker -->
  <section id="pickScreen" class="screen scroll" hidden>
    <h1>Who's playing?</h1>
    <p class="muted">Your phone will remember you after this.</p>
    <div class="pick-block">
      <label for="newName" class="pick-label">New player?</label>
      <div class="pick-row">
        <input id="newName" type="text" maxlength="20" autocomplete="off" autocapitalize="words" placeholder="Type your name">
        <button id="joinBtn" class="pick-btn">Join</button>
      </div>
      <div id="newErr" class="pick-err" hidden></div>
    </div>
    <div class="pick-or"><span>or</span></div>
    <div class="pick-block">
      <label for="findName" class="pick-label">Already playing? Find your name</label>
      <input id="findName" class="pick-search" type="search" autocomplete="off" autocapitalize="words" placeholder="Start typing your name">
      <div id="matches" class="matches"></div>
    </div>
  </section>

  <!-- Game -->
  <section id="gameScreen" class="screen game" hidden>
    <div id="globeWrap" class="globe-wrap">
      <canvas id="stars" class="stars" aria-hidden="true"></canvas>
      <div id="map"></div>
      <div id="qcard" class="qcard">
        <div id="prog" class="prog" aria-hidden="true"></div>
        <div class="qhead"><span id="qNum"></span><span id="qPts"></span></div>
        <p id="qClue" class="clue"></p>
      </div>
      <div id="hint" class="hint">Tap to drop a pin · drag to spin · pinch to zoom</div>
      <div id="milesChip" class="miles-chip" hidden></div>
      <div id="result" class="result" hidden>
        <div class="rtop"><span id="rEmoji" class="remoji"></span><div><div id="rAnswer" class="ranswer"></div><div id="rDist" class="rdist"></div></div><div id="rPts" class="rpts"></div></div>
        <p id="rFact" class="fact"></p>
      </div>
      <div id="bottomBar" class="bottom">
        <button id="confirmBtn" class="primary" disabled>Confirm</button>
        <button id="nextBtn" class="primary" hidden>Next</button>
      </div>
    </div>
  </section>

  <!-- Summary + leaderboard -->
  <section id="doneScreen" class="screen scroll done" hidden>
    <div class="summary">
      <div id="sTitle" class="day"></div>
      <div class="stotal"><strong id="sTotal"></strong><span id="sMax"></span></div>
      <div id="sEmoji" class="semoji"></div>
      <div id="sNote" class="muted small"></div>
    </div>
    <ol id="sList" class="slist"></ol>
    <div id="podiumWrap" class="podium-wrap" hidden>
      <div class="lbl">Today's top 3</div>
      <div id="podium" class="podium"></div>
    </div>
    <div class="share-wrap">
      <button id="shareBtn" class="primary">Share result</button>
      <div id="copied" class="muted small" hidden>Copied! Paste it wherever you want to share it.</div>
    </div>
    <div class="board">
      <div class="tabs" role="tablist">
        <button data-tab="today" class="tab on">Today</button>
        <button data-tab="week" class="tab">This week</button>
        <button data-tab="avg" class="tab">All-time</button>
        <button data-tab="streak" class="tab">Streaks</button>
      </div>
      <ol id="boardList" class="board-list"></ol>
      <div id="boardNote" class="muted small"></div>
    </div>
    <section class="review-wrap" aria-labelledby="revTitle">
      <h2 id="revTitle" class="lbl">Question review</h2>
      <div id="review" class="review"></div>
    </section>
    <div class="past">
      <label for="pastSel" class="muted small">Play an old day for fun (not scored)</label>
      <div class="past-row"><select id="pastSel"></select><button id="pastBtn">Play</button></div>
    </div>
  </section>

  <!-- Message screen -->
  <section id="msgScreen" class="screen" hidden>
    <h1 id="msgTitle"></h1>
    <p id="msgBody" class="muted"></p>
  </section>

  <div id="demo" class="demo" hidden>Demo mode — scores are only saved on this device.</div>
</div>
<script src="config.js?v=16"></script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="app.js?v=16"></script>
</body>
</html>
