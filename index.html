<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<title>Good Globe Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Good Globe Game</div>
    <div class="meta"><span id="dateLabel"></span><button id="whoBtn" class="linkish" hidden></button></div>
  </header>

  <!-- Name picker -->
  <section id="pickScreen" class="screen" hidden>
    <h1>Who's playing?</h1>
    <p class="muted">Tap your name. Your phone will remember it.</p>
    <div id="nameGrid" class="name-grid"></div>
  </section>

  <!-- Game -->
  <section id="gameScreen" class="screen game" hidden>
    <div class="qcard">
      <div class="qhead"><span id="qNum"></span><span id="qPts"></span></div>
      <p id="qClue" class="clue"></p>
    </div>
    <div id="globeWrap" class="globe-wrap">
      <div id="map"></div>
      <div id="hint" class="hint">Tap to drop a pin · drag to spin · pinch to zoom</div>
    </div>
    <div class="bottom">
      <button id="confirmBtn" class="primary" disabled>Confirm</button>
      <div id="result" class="result" hidden>
        <div class="rtop"><span id="rEmoji" class="remoji"></span><div><div id="rAnswer" class="ranswer"></div><div id="rDist" class="muted"></div></div><div id="rPts" class="rpts"></div></div>
        <p id="rFact" class="fact"></p>
        <button id="nextBtn" class="primary">Next</button>
      </div>
    </div>
  </section>

  <!-- Summary + leaderboard -->
  <section id="doneScreen" class="screen scroll" hidden>
    <div class="summary">
      <div id="sTitle" class="muted"></div>
      <div id="sEmoji" class="semoji"></div>
      <div id="sTotal" class="stotal"></div>
      <div id="sNote" class="muted small"></div>
      <button id="shareBtn" class="primary">Share result</button>
      <div id="copied" class="muted small" hidden>Copied — paste it in the family chat.</div>
    </div>
    <ol id="sList" class="slist"></ol>
    <div class="board">
      <div class="tabs" role="tablist">
        <button data-tab="today" class="tab on">Today</button>
        <button data-tab="week" class="tab">This week</button>
        <button data-tab="avg" class="tab">All-time</button>
        <button data-tab="streak" class="tab">Streaks</button>
      </div>
      <ol id="boardList" class="board-list"></ol>
      <div id="boardNote" class="muted small"></div>
    </div>
    <div class="past">
      <label for="pastSel" class="muted small">Play an old day for fun (not scored)</label>
      <div class="past-row"><select id="pastSel"></select><button id="pastBtn">Play</button></div>
    </div>
  </section>

  <!-- Message screen -->
  <section id="msgScreen" class="screen" hidden>
    <h1 id="msgTitle"></h1>
    <p id="msgBody" class="muted"></p>
  </section>

  <div id="demo" class="demo" hidden>Demo mode — scores are only saved on this device.</div>
</div>
<script src="config.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
